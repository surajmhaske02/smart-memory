[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-memory"
version = "0.3.0"
description = "Governed, four-store memory for AI agents: retain, recall, reuse, refine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Suraj Mhaske" }]
keywords = ["ai", "agents", "llm", "memory", "rag", "context-engineering", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
smart-memory = "smart_memory.cli:main"

[project.urls]
Homepage = "https://github.com/surajmhaske02/smart-memory"
Issues = "https://github.com/surajmhaske02/smart-memory/issues"
Changelog = "https://github.com/surajmhaske02/smart-memory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fast = ["numpy>=1.21"]
local = ["sentence-transformers>=2.2"]
fastembed = ["fastembed>=0.3"]
postgres = ["psycopg[binary]>=3.1"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["smart_memory*"]

[tool.setuptools.package-data]
smart_memory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B905"]
